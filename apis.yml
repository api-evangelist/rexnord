aid: rexnord
name: Rexnord
description: >-
  Rexnord was a global industrial company headquartered in Milwaukee, Wisconsin,
  with two strategic platforms — Process and Motion Control (bearings, couplings,
  gear drives, industrial chain, and conveyor systems) and Water Management
  (plumbing components for commercial, industrial, municipal, and institutional
  settings). In 2021, Rexnord's Process and Motion Control segment merged with
  Regal Beloit to form Regal Rexnord Corporation, while the water management
  business was acquired by Zurn Elkay. Rexnord does not offer a public developer
  API or data services.
